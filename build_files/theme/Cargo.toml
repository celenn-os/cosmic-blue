[package]
name = "celenn-theme"
version = "0.1.0"
edition = "2024"
publish = false

# Same libcosmic revision as the COSMIC 1.12.0 packages in Fedora 45
# (cosmic-settings epoch-1.12.0 Cargo.lock). Update it with COSMIC, together
# with build_files/cosmic-version. Cargo.lock is that cosmic-settings
# Cargo.lock trimmed to our dependencies, so the theme is built with the same
# crate versions as Fedora's COSMIC (the Containerfile builds with --locked).
[dependencies]
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "be7937d5c2495d002311709d0e68c3f8f845265a", default-features = false }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "be7937d5c2495d002311709d0e68c3f8f845265a", default-features = false }
